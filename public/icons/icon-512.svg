<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FairyDiary app icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#0d0618"/>
      <stop offset="100%" stop-color="#130d30"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a0533" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="108" fill="url(#glowCenter)"/>

  <!-- Ambient stars -->
  <g opacity="0.7" filter="url(#starGlow)">
    <circle cx="80"  cy="90"  r="2" fill="#e9d5ff"/>
    <circle cx="420" cy="70"  r="1.5" fill="#c084fc"/>
    <circle cx="440" cy="140" r="2" fill="#f0abfc"/>
    <circle cx="70"  cy="380" r="1.5" fill="#ddd6fe"/>
    <circle cx="100" cy="160" r="1" fill="#e9d5ff"/>
    <circle cx="400" cy="350" r="1.8" fill="#c4b5fd"/>
    <circle cx="350" cy="80"  r="1.2" fill="#fde68a"/>
    <circle cx="150" cy="420" r="1.5" fill="#f0abfc"/>
    <circle cx="440" cy="420" r="1" fill="#e9d5ff"/>
  </g>

  <!-- Decorative sparkles -->
  <g opacity="0.85">
    <path d="M105 125 l4-12 4 12 12 4-12 4-4 12-4-12-12-4z" fill="#fbbf24"/>
    <path d="M415 105 l3-9 3 9 9 3-9 3-3 9-3-9-9-3z" fill="#fde68a"/>
    <path d="M390 380 l3-9 3 9 9 3-9 3-3 9-3-9-9-3z" fill="#f0abfc"/>
    <path d="M85 320 l2-7 2 7 7 2-7 2-2 7-2-7-7-2z" fill="#c4b5fd"/>
  </g>

  <!-- Open diary book -->
  <g filter="url(#dropShadow)" transform="translate(256 260)">
    <!-- Back cover shadow -->
    <rect x="-140" y="-100" width="280" height="200" rx="12" fill="#4c1d95" opacity="0.3" transform="translate(4,6)"/>
    
    <!-- Book spine/center -->
    <rect x="-6" y="-105" width="12" height="210" rx="6" fill="url(#spineGrad)"/>
    
    <!-- Left page -->
    <path d="M-6,-100 Q-8,-100 -135,-95 Q-145,-94 -145,-84 L-145,90 Q-145,100 -135,100 L-6,105 Z" fill="url(#pageGrad)" stroke="#e9d5ff" stroke-width="1"/>
    
    <!-- Right page -->
    <path d="M6,-100 Q8,-100 135,-95 Q145,-94 145,-84 L145,90 Q145,100 135,100 L6,105 Z" fill="url(#pageGrad)" stroke="#e9d5ff" stroke-width="1"/>
    
    <!-- Page lines (left) -->
    <g opacity="0.2" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round">
      <line x1="-120" y1="-55" x2="-25" y2="-55"/>
      <line x1="-120" y1="-35" x2="-30" y2="-35"/>
      <line x1="-120" y1="-15" x2="-25" y2="-15"/>
      <line x1="-120" y1="5"   x2="-35" y2="5"/>
      <line x1="-120" y1="25"  x2="-25" y2="25"/>
      <line x1="-120" y1="45"  x2="-30" y2="45"/>
      <line x1="-120" y1="65"  x2="-40" y2="65"/>
    </g>
    
    <!-- Page lines (right) -->
    <g opacity="0.2" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round">
      <line x1="25" y1="-55" x2="120" y2="-55"/>
      <line x1="30" y1="-35" x2="120" y2="-35"/>
      <line x1="25" y1="-15" x2="120" y2="-15"/>
      <line x1="35" y1="5"   x2="120" y2="5"/>
      <line x1="25" y1="25"  x2="120" y2="25"/>
      <line x1="30" y1="45"  x2="120" y2="45"/>
      <line x1="25" y1="65"  x2="115" y2="65"/>
    </g>

    <!-- Purple ink writing accents on left page -->
    <g opacity="0.35" stroke="url(#inkGrad)" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M-115,-55 C-100,-58 -80,-52 -60,-55"/>
      <path d="M-115,-35 C-95,-38 -75,-32 -50,-35"/>
      <path d="M-115,-15 C-90,-18 -70,-12 -55,-15"/>
    </g>
  </g>

  <!-- Quill pen -->
  <g filter="url(#softGlow)" transform="translate(330 155) rotate(35)">
    <!-- Feather body -->
    <path d="M0,0 C-8,-30 -5,-70 0,-110 C5,-70 8,-30 0,0Z" fill="url(#quillGrad)" opacity="0.95"/>
    <!-- Feather spine -->
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#d97706" stroke-width="1.5"/>
    <!-- Feather barbs left -->
    <g opacity="0.5" stroke="#fbbf24" stroke-width="0.8" fill="none">
      <path d="M0,-30 C-12,-35 -18,-28 -20,-22"/>
      <path d="M0,-50 C-14,-55 -22,-48 -25,-40"/>
      <path d="M0,-70 C-12,-76 -20,-68 -22,-60"/>
      <path d="M0,-90 C-10,-96 -16,-88 -18,-80"/>
    </g>
    <!-- Feather barbs right -->
    <g opacity="0.5" stroke="#fbbf24" stroke-width="0.8" fill="none">
      <path d="M0,-30 C12,-35 18,-28 20,-22"/>
      <path d="M0,-50 C14,-55 22,-48 25,-40"/>
      <path d="M0,-70 C12,-76 20,-68 22,-60"/>
      <path d="M0,-90 C10,-96 16,-88 18,-80"/>
    </g>
    <!-- Nib -->
    <path d="M-2,0 L0,18 L2,0Z" fill="#7c3aed"/>
    <!-- Ink drop -->
    <circle cx="0" cy="22" r="3" fill="#a855f7" opacity="0.7"/>
  </g>

  <!-- Central magic glow accent -->
  <circle cx="256" cy="260" r="40" fill="#c084fc" opacity="0.06"/>
  <circle cx="256" cy="260" r="25" fill="#a855f7" opacity="0.08"/>

  <!-- Floating hearts -->
  <g opacity="0.6">
    <path d="M130 390 C130 385 136 382 140 386 C144 382 150 385 150 390 C150 396 140 402 140 402 C140 402 130 396 130 390Z" fill="#ec4899"/>
    <path d="M390 200 C390 196 394 194 397 197 C400 194 404 196 404 200 C404 204 397 208 397 208 C397 208 390 204 390 200Z" fill="#f472b6" opacity="0.5"/>
  </g>

  <!-- "FD" monogram watermark -->
  <g opacity="0.08" transform="translate(256 265)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#c084fc">FD</text>
  </g>
</svg>