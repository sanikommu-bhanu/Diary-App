<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="FairyDiary app icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#0d0618"/>
      <stop offset="100%" stop-color="#130d30"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a0533" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  <rect width="192" height="192" rx="40" fill="url(#glowCenter)"/>

  <!-- Stars -->
  <g opacity="0.7" filter="url(#starGlow)">
    <circle cx="30"  cy="35"  r="1" fill="#e9d5ff"/>
    <circle cx="158" cy="28"  r="0.8" fill="#c084fc"/>
    <circle cx="165" cy="55"  r="1" fill="#f0abfc"/>
    <circle cx="28"  cy="145" r="0.8" fill="#ddd6fe"/>
    <circle cx="155" cy="135" r="0.8" fill="#c4b5fd"/>
    <circle cx="38"  cy="60"  r="0.6" fill="#e9d5ff"/>
  </g>

  <!-- Sparkles -->
  <g opacity="0.85">
    <path d="M40 48 l2-6 2 6 6 2-6 2-2 6-2-6-6-2z" fill="#fbbf24"/>
    <path d="M155 42 l1.5-4.5 1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5z" fill="#fde68a"/>
    <path d="M148 145 l1.5-4 1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5z" fill="#f0abfc"/>
  </g>

  <!-- Open diary book -->
  <g filter="url(#dropShadow)" transform="translate(96 98)">
    <!-- Spine -->
    <rect x="-2.5" y="-40" width="5" height="80" rx="2.5" fill="url(#spineGrad)"/>
    
    <!-- Left page -->
    <path d="M-2.5,-38 Q-3,-38 -52,-36 Q-55,-36 -55,-33 L-55,34 Q-55,38 -52,38 L-2.5,40 Z" fill="url(#pageGrad)" stroke="#e9d5ff" stroke-width="0.5"/>
    
    <!-- Right page -->
    <path d="M2.5,-38 Q3,-38 52,-36 Q55,-36 55,-33 L55,34 Q55,38 52,38 L2.5,40 Z" fill="url(#pageGrad)" stroke="#e9d5ff" stroke-width="0.5"/>
    
    <!-- Page lines left -->
    <g opacity="0.2" stroke="#a78bfa" stroke-width="0.6" stroke-linecap="round">
      <line x1="-45" y1="-20" x2="-10" y2="-20"/>
      <line x1="-45" y1="-10" x2="-12" y2="-10"/>
      <line x1="-45" y1="0"   x2="-10" y2="0"/>
      <line x1="-45" y1="10"  x2="-14" y2="10"/>
      <line x1="-45" y1="20"  x2="-10" y2="20"/>
    </g>
    
    <!-- Page lines right -->
    <g opacity="0.2" stroke="#a78bfa" stroke-width="0.6" stroke-linecap="round">
      <line x1="10" y1="-20" x2="45" y2="-20"/>
      <line x1="12" y1="-10" x2="45" y2="-10"/>
      <line x1="10" y1="0"   x2="45" y2="0"/>
      <line x1="14" y1="10"  x2="45" y2="10"/>
      <line x1="10" y1="20"  x2="45" y2="20"/>
    </g>
  </g>

  <!-- Quill pen -->
  <g transform="translate(124 58) rotate(35)">
    <path d="M0,0 C-3,-12 -2,-28 0,-42 C2,-28 3,-12 0,0Z" fill="url(#quillGrad)" opacity="0.95"/>
    <line x1="0" y1="0" x2="0" y2="-42" stroke="#d97706" stroke-width="0.7"/>
    <path d="M-1,0 L0,7 L1,0Z" fill="#7c3aed"/>
    <circle cx="0" cy="9" r="1.2" fill="#a855f7" opacity="0.7"/>
  </g>

  <!-- Heart -->
  <path d="M50 150 C50 147 53 146 55 148 C57 146 60 147 60 150 C60 153 55 156 55 156 C55 156 50 153 50 150Z" fill="#ec4899" opacity="0.5"/>
</svg>